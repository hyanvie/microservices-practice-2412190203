services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: secondlight-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env before starting Nacos}"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY in .env before starting Nacos}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env before starting Nacos}"
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18081}:8080"
      - "127.0.0.1:${NACOS_SERVER_PORT:-18848}:8848"
      - "127.0.0.1:${NACOS_CLIENT_PORT:-19848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8848/nacos/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  user-db:
    image: mysql:8.4.11
    container_name: secondlight-user-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secondlight_user
      MYSQL_USER: user_user
      MYSQL_PASSWORD: user_pass
      MYSQL_ROOT_PASSWORD: ${USER_DB_ROOT_PASSWORD:-user_root_pass}
    volumes:
      - user-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uuser_user -puser_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  item-db:
    image: mysql:8.4.11
    container_name: secondlight-item-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secondlight_item
      MYSQL_USER: item_user
      MYSQL_PASSWORD: item_pass
      MYSQL_ROOT_PASSWORD: ${ITEM_DB_ROOT_PASSWORD:-item_root_pass}
    volumes:
      - item-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uitem_user -pitem_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-db:
    image: mysql:8.4.11
    container_name: secondlight-order-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: secondlight_order
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD:-order_root_pass}
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uorder_user -porder_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    image: secondlight-user-service:week06
    container_name: secondlight-user-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://user-db:3306/secondlight_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: "${NACOS_USERNAME:?Set NACOS_USERNAME in .env after initializing Nacos}"
      NACOS_PASSWORD: "${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env after initializing Nacos}"
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_DISCOVERY_ENABLED: "true"
    depends_on:
      user-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-18093}:8083"

  item-service:
    build:
      context: ./services/item-service
      dockerfile: Dockerfile
    image: secondlight-item-service:week06
    container_name: secondlight-item-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://item-db:3306/secondlight_item?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: item_user
      DB_PASSWORD: item_pass
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: "${NACOS_USERNAME:?Set NACOS_USERNAME in .env after initializing Nacos}"
      NACOS_PASSWORD: "${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env after initializing Nacos}"
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_DISCOVERY_ENABLED: "true"
    depends_on:
      item-db:
        condition: service_healthy
      nacos:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ITEM_SERVICE_PORT:-18091}:8081"

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    image: secondlight-order-service:week06
    container_name: secondlight-order-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://order-db:3306/secondlight_order?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: order_user
      DB_PASSWORD: order_pass
      ITEM_SERVICE_URL: http://item-service:8081
      ITEM_CONNECT_TIMEOUT_MS: ${ITEM_CONNECT_TIMEOUT_MS:-1000}
      ITEM_READ_TIMEOUT_MS: ${ITEM_READ_TIMEOUT_MS:-2000}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: "${NACOS_USERNAME:?Set NACOS_USERNAME in .env after initializing Nacos}"
      NACOS_PASSWORD: "${NACOS_PASSWORD:?Set NACOS_PASSWORD in .env after initializing Nacos}"
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      NACOS_DISCOVERY_ENABLED: "true"
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-18092}:8082"
    depends_on:
      item-service:
        condition: service_started
      order-db:
        condition: service_healthy
      nacos:
        condition: service_healthy

volumes:
  nacos-data:
  nacos-logs:
  user-db-data:
  item-db-data:
  order-db-data:
