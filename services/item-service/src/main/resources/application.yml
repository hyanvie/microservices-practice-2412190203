spring:
  application:
    name: item-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/secondlight_item?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:item_user}
    password: ${DB_PASSWORD:item_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
