spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/secondlight_order?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8082}

clients:
  item:
    base-url: ${ITEM_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${ITEM_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ITEM_READ_TIMEOUT_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
