spring:
  application:
    name: secondlight-monolith   # 应用名
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/secondlight?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:secondlight}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080   # 默认端口，如果改了要在 README 里写明

management:
  endpoints:
    web:
      exposure:
        include: health,info   # 暴露 /actuator/health